<circle cx="600" cy="42" r="3" fill="#8FBCBB"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="600" y="118" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="700" font-size="42" fill="url(#textGrad)">Hi, I'm Chetan <tspan font-size="36">&#128075;</tspan></text>
<text x="600" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="17" fill="#D8DEE9">AI/ML Engineer in the Making | CSE-AI/ML Undergrad</text>
