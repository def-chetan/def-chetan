<svg width="100%" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img"><title>Animated AI-themed profile banner</title><desc>A dark navy rounded banner with pulsing neural network nodes on both sides, drifting binary digits, a sweeping light beam, and a gradient-filled greeting "Hi, I'm Chetan" with a blinking cursor.</desc>
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#232733"/>
<stop offset="50%" stop-color="#2E3440"/>
<stop offset="100%" stop-color="#3B4252"/>
</linearGradient>
<linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8FBCBB"/>
<stop offset="50%" stop-color="#88C0D0"/>
<stop offset="100%" stop-color="#81A1C1"/>
</linearGradient>
<radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#88C0D0" stop-opacity="0.28"/>
<stop offset="100%" stop-color="#88C0D0" stop-opacity="0"/>
</radialGradient>
<linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ECEFF4" stop-opacity="0"/>
<stop offset="50%" stop-color="#ECEFF4" stop-opacity="0.10"/>
<stop offset="100%" stop-color="#ECEFF4" stop-opacity="0"/>
</linearGradient>
<clipPath id="roundedClip"><rect x="0" y="0" width="1200" height="220" rx="40"/></clipPath>
</defs>
<g clip-path="url(#roundedClip)">
<rect x="0" y="0" width="1200" height="220" fill="url(#bgGrad)"/>
<rect x="-120" y="0" width="90" height="220" fill="url(#scanGrad)"><animateTransform attributeName="transform" type="translate" values="0,0; 1400,0; 1400,0" keyTimes="0;0.85;1" dur="7s" repeatCount="indefinite"/></rect>
<ellipse cx="600" cy="108" rx="440" ry="150" fill="url(#glowGrad)"/>
<g stroke="#4C566A" stroke-width="1.2" opacity="0.35" fill="none">
<path d="M0,45 H90 V75 H180"/>
<path d="M1200,165 H1090 V135 H1010"/>
<path d="M0,185 H60 V155 H140 V175 H235"/>
