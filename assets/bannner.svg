<svg width="100%" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img"><title>Advanced animated terminal-style AI profile banner</title><desc>A dark glassmorphic terminal window floating over a starfield and neural-network scene, typing "$ whoami" and revealing the name Chetan Lohia in a cyan-violet-pink gradient, with a pulsing online indicator in the title bar, flanked by two neural network clusters with traveling signal pulses in matching colors.</desc>
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0B0D16"/><stop offset="50%" stop-color="#12141F"/><stop offset="100%" stop-color="#171A2B"/></linearGradient>
<radialGradient id="nebulaViolet" cx="25%" cy="30%" r="55%"><stop offset="0%" stop-color="#B388FF" stop-opacity="0.16"/><stop offset="100%" stop-color="#B388FF" stop-opacity="0"/></radialGradient>
<radialGradient id="nebulaPink" cx="78%" cy="75%" r="55%"><stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.14"/><stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"/></radialGradient>
<linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#64FFDA"/><stop offset="50%" stop-color="#B388FF"/><stop offset="100%" stop-color="#FF6B9D"/></linearGradient>
<linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<pattern id="hexGrid" width="34" height="30" patternUnits="userSpaceOnUse"><path d="M17,0 L34,8.5 L34,21.5 L17,30 L0,21.5 L0,8.5 Z" fill="none" stroke="#232640" stroke-width="0.5"/></pattern>
<filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<mask id="promptReveal"><rect x="266" y="80" width="0" height="26" fill="#fff"><animate attributeName="width" values="0;190;190;0" keyTimes="0;0.15;0.85;1" dur="8s" repeatCount="indefinite"/></rect></mask>
<clipPath id="roundedClip"><rect x="0" y="0" width="1200" height="220" rx="40"/></clipPath>
